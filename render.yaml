services:
  # 1. Backend Web Service
  - type: web
    name: mini-erp-crm-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run db:schema && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        sync: false

  # 2. Frontend Static Site
  - type: static
    name: mini-erp-crm-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  # 3. PostgreSQL Managed Database
  - name: mini-erp-crm-db
    databaseName: mini_erp_crm
    user: postgres
